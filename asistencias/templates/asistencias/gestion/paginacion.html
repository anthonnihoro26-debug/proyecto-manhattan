{% if pagina.paginator.num_pages > 1 %}<div class="paginacion">{% if pagina.has_previous %}<a class="btn subtle" href="?pagina={{ pagina.previous_page_number }}{% if busqueda %}&q={{ busqueda|urlencode }}{% endif %}{% if dia_iso %}&fecha={{ dia_iso }}{% endif %}{% if modo %}&modo={{ modo }}{% endif %}">← Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a class="btn subtle" href="?pagina={{ pagina.next_page_number }}{% if busqueda %}&q={{ busqueda|urlencode }}{% endif %}{% if dia_iso %}&fecha={{ dia_iso }}{% endif %}{% if modo %}&modo={{ modo }}{% endif %}">Siguiente →</a>{% endif %}</div>{% endif %}
